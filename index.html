  <!-- JSON-LD: FAQPage (+40% AI visibility) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "FAQPage",
    "mainEntity": [
      {
        "@type": "Question",
        "name": "¿Qué es TuTurno?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "TuTurno es una plataforma de reservas online para negocios que gestionan espacios reservables como canchas deportivas, salas de reuniones, consultorios, mesas de restaurante y más. Permite a los clientes ver la disponibilidad en tiempo real y solicitar su turno en segundos, sin necesidad de llamar por teléfono."
        }
      },
      {
        "@type": "Question",
        "name": "¿Cómo funciona TuTurno?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "El negocio configura sus espacios (canchas, salas, consultorios), sus horarios de operación y las reglas de reserva. Los clientes acceden a la página pública del negocio, ven los turnos disponibles en un calendario visual y solicitan el que prefieran. El negocio recibe la solicitud y puede confirmarla o rechazarla manualmente. Las notificaciones se envían automáticamente por correo electrónico."
        }
      },
      {
        "@type": "Question",
        "name": "¿Qué tipos de negocios pueden usar TuTurno?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "TuTurno sirve para cualquier negocio que gestione espacios reservables: canchas de fútbol, tenis o pádel; salas de reuniones o eventos; consultorios médicos o de terapia; mesas de restaurante; estudios de grabación; canchas de baloncesto; y cualquier espacio que requiera gestión de turnos por horario."
        }
      },
      {
        "@type": "Question",
        "name": "¿Los clientes necesitan registrarse para reservar?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Los clientes pueden ver la disponibilidad sin registrarse. Para crear una reserva, pueden registrarse o el negocio puede crear la reserva por ellos como invitado. Cuando un invitado se registra posteriormente, sus datos se vinculan automáticamente con las reservas existentes."
        }
      },
      {
        "@type": "Question",
        "name": "¿TuTurno funciona en el celular?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Sí, TuTurno está diseñado con un enfoque mobile-first. Tanto la página pública para clientes como el panel de administración funcionan perfectamente en dispositivos móviles, con targets táctiles optimizados y navegación adaptada al pulgar."
        }
      },
      {
        "@type": "Question",
        "name": "¿Cómo empiezo a usar TuTurno con mi negocio?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Para empezar, contacta al equipo de TuTurno para crear tu organización. Luego configuras tus espacios, horarios y reglas de operación desde el panel de administración. Tus clientes acceden a tu página pública mediante un enlace personalizado del tipo tuturno.online/b/tu-negocio."
        }
      }
    ]
  }

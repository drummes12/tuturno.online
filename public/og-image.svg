<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#0f7a4a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22b978" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#22b978" stop-opacity="0"/>
    </radialGradient>
    <mask id="hands" maskUnits="userSpaceOnUse" x="238.373" y="225.949" width="180" height="180">
      <circle cx="328.373" cy="315.949" r="82" fill="#fff"/>
      <path d="M328.373 315.949v-43M328.373 315.949l36.373-21" stroke="#000" stroke-width="13" stroke-linecap="round"/>
    </mask>
  </defs>

  <!-- Fondo: verde oscuro de marca -->
  <rect width="1200" height="630" fill="#071510"/>

  <!-- Motivo del "pitch": halo mint + línea central + anillo-reloj,
       el mismo lenguaje decorativo del hero y las papeletas. -->
  <circle cx="1080" cy="560" r="420" fill="url(#glow)"/>

  <!-- Reloj marcando 12:12: anillo doble, marcas cardinales,
       horaria al 12 y minutero al minuto 12. -->
  <circle cx="1052" cy="470" r="190" fill="none" stroke="#143326" stroke-width="26"/>
  <circle cx="1052" cy="470" r="190" fill="none" stroke="#244136" stroke-width="2"/>
  <g fill="#2d5c46">
    <rect x="1046" y="307" width="12" height="26" rx="6"/>
    <rect x="1189" y="464" width="26" height="12" rx="6"/>
    <rect x="1046" y="607" width="12" height="26" rx="6"/>
    <rect x="889" y="464" width="26" height="12" rx="6"/>
  </g>
  <line x1="1052" y1="470" x2="1060" y2="391" stroke="#34d399" stroke-width="20" stroke-linecap="round"/>
  <line x1="1052" y1="470" x2="1166" y2="433" stroke="#34d399" stroke-width="16" stroke-linecap="round"/>
  <circle cx="1052" cy="470" r="12" fill="#34d399"/>

  <!-- Icono de marca: glifo calendario + reloj -->
  <g transform="translate(96 108) scale(0.3125)">
    <rect width="512" height="512" rx="112" fill="url(#brand)"/>
    <g transform="scale(1.024)">
      <path d="M179.57 119v33.35M316.11 119v33.35" stroke="#ffffff" stroke-width="26" stroke-linecap="round"/>
      <path fill="#ffffff" d="M127.59 140h18.98a6 6 0 0 1 6 6v6.35a27 27 0 0 0 54 0V146a6 6 0 0 1 6-6h70.54a6 6 0 0 1 6 6v6.35a27 27 0 0 0 54 0V146a6 6 0 0 1 6-6h18.98a30 30 0 0 1 30 30v63.465a108 108 0 0 0-69.717-25.516H154.59a14 14 0 0 0-14 14V333.5a14 14 0 0 0 14 14h64.734a8 8 0 0 1 7.52 5.272 108 108 0 0 0 13.071 25.138 8 8 0 0 1-6.552 12.59H127.59a30 30 0 0 1-30-30V170a30 30 0 0 1 30-30"/>
      <circle cx="328.373" cy="315.949" r="82" fill="#ffffff" mask="url(#hands)"/>
    </g>
  </g>

  <!-- Wordmark -->
  <text x="278" y="222" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="64" font-weight="800" fill="#f2f8f5" letter-spacing="-2">
    Tu<tspan fill="#34d399">Turno</tspan>
  </text>

  <!-- Headline: slogan de marca -->
  <text x="96" y="372" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="82" font-weight="800" fill="#f2f8f5" letter-spacing="-3">
    Más que turnos,
  </text>
  <text x="96" y="466" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="82" font-weight="800" fill="#34d399" letter-spacing="-3">
    son oportunidades.
  </text>

  <!-- Texto de apoyo -->
  <text x="96" y="540" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="30" font-weight="500" fill="#9bafa5" letter-spacing="-0.5">
    Gestiona tus reservas de forma simple, rápida y eficiente.
  </text>
</svg>

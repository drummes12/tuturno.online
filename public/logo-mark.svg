    </mask>
  </defs>

  <!-- Contenedor: cuadrado redondeado con el degradado de marca -->
  <rect width="512" height="512" rx="112" fill="url(#brand)"/>

  <!-- Glifo calendario + reloj (500×500 → 512 con margen propio) -->

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" fill="none">
  <!-- Clock-only version for QR overlay: no green square, just the face.
       Designed to sit on a white rounded background inside the QR. -->

  <!-- Clock face — white circle with subtle ring -->
  <circle cx="150" cy="150" r="140" fill="#f8faf7"/>
  <circle cx="150" cy="150" r="130" fill="none" stroke="#dfe6da" stroke-width="3"/>

  <!-- Hour marks (12, 3, 6, 9) -->
  <rect x="146" y="22" width="8" height="24" rx="3" fill="#2c342f"/>
  <rect x="254" y="146" width="24" height="8" rx="3" fill="#2c342f"/>
  <rect x="146" y="254" width="8" height="24" rx="3" fill="#2c342f"/>
  <rect x="22" y="146" width="24" height="8" rx="3" fill="#2c342f"/>

  <!-- Minor marks (1,2,4,5,7,8,10,11) -->
  <rect x="146" y="26" width="5" height="14" rx="2" fill="#5a655d" opacity="0.45" transform="rotate(30 150 150)"/>
  <rect x="146" y="26" width="5" height="14" rx="2" fill="#5a655d" opacity="0.45" transform="rotate(60 150 150)"/>
  <rect x="146" y="26" width="5" height="14" rx="2" fill="#5a655d" opacity="0.45" transform="rotate(120 150 150)"/>
  <rect x="146" y="26" width="5" height="14" rx="2" fill="#5a655d" opacity="0.45" transform="rotate(150 150 150)"/>
  <rect x="146" y="26" width="5" height="14" rx="2" fill="#5a655d" opacity="0.45" transform="rotate(210 150 150)"/>
  <rect x="146" y="26" width="5" height="14" rx="2" fill="#5a655d" opacity="0.45" transform="rotate(240 150 150)"/>
  <rect x="146" y="26" width="5" height="14" rx="2" fill="#5a655d" opacity="0.45" transform="rotate(300 150 150)"/>
  <rect x="146" y="26" width="5" height="14" rx="2" fill="#5a655d" opacity="0.45" transform="rotate(330 150 150)"/>

  <!-- Hour hand — ~10 o'clock -->
  <line x1="150" y1="150" x2="88" y2="88" stroke="#0a5226" stroke-width="14" stroke-linecap="round"/>

  <!-- Minute hand — ~2 o'clock -->
  <line x1="150" y1="150" x2="210" y2="100" stroke="#0a7d3b" stroke-width="10" stroke-linecap="round"/>

  <!-- Center dot — floodlight yellow -->
  <circle cx="150" cy="150" r="16" fill="#facc15"/>
  <circle cx="150" cy="150" r="8" fill="#0a5226"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Background: rounded square with pitch green -->
  <rect width="512" height="512" rx="112" fill="#0a5226"/>

  <!-- Subtle pitch lines decoration -->
  <rect x="56" y="56" width="400" height="400" rx="24" stroke="#0a7d3b" stroke-width="3" opacity="0.5"/>
  <line x1="256" y1="56" x2="256" y2="456" stroke="#0a7d3b" stroke-width="3" opacity="0.4"/>
  <circle cx="256" cy="256" r="48" stroke="#0a7d3b" stroke-width="3" opacity="0.4"/>

  <!-- Clock circle — white/chalk -->
  <circle cx="256" cy="256" r="140" fill="#f8faf7" stroke="#f8faf7" stroke-width="0"/>

  <!-- Clock inner ring -->
  <circle cx="256" cy="256" r="130" fill="none" stroke="#e2e8e0" stroke-width="4"/>

  <!-- Hour marks (12, 3, 6, 9) -->
  <rect x="252" y="136" width="8" height="20" rx="3" fill="#2c342f"/>
  <rect x="356" y="248" width="20" height="8" rx="3" fill="#2c342f"/>
  <rect x="252" y="356" width="8" height="20" rx="3" fill="#2c342f"/>
  <rect x="136" y="248" width="20" height="8" rx="3" fill="#2c342f"/>

  <!-- Minor marks -->
  <rect x="252" y="140" width="4" height="10" rx="2" fill="#5a655d" opacity="0.5" transform="rotate(30 256 256)"/>
  <rect x="252" y="140" width="4" height="10" rx="2" fill="#5a655d" opacity="0.5" transform="rotate(60 256 256)"/>
  <rect x="252" y="140" width="4" height="10" rx="2" fill="#5a655d" opacity="0.5" transform="rotate(120 256 256)"/>
  <rect x="252" y="140" width="4" height="10" rx="2" fill="#5a655d" opacity="0.5" transform="rotate(150 256 256)"/>
  <rect x="252" y="140" width="4" height="10" rx="2" fill="#5a655d" opacity="0.5" transform="rotate(210 256 256)"/>
  <rect x="252" y="140" width="4" height="10" rx="2" fill="#5a655d" opacity="0.5" transform="rotate(240 256 256)"/>
  <rect x="252" y="140" width="4" height="10" rx="2" fill="#5a655d" opacity="0.5" transform="rotate(300 256 256)"/>
  <rect x="252" y="140" width="4" height="10" rx="2" fill="#5a655d" opacity="0.5" transform="rotate(330 256 256)"/>

  <!-- Hour hand — pointing to ~10 o'clock position (dynamic angle) -->
  <line x1="256" y1="256" x2="196" y2="196" stroke="#0a5226" stroke-width="14" stroke-linecap="round"/>

  <!-- Minute hand — pointing to ~2 o'clock position -->
  <line x1="256" y1="256" x2="340" y2="208" stroke="#0a7d3b" stroke-width="10" stroke-linecap="round"/>

  <!-- Center dot — floodlight yellow accent -->
  <circle cx="256" cy="256" r="16" fill="#facc15"/>
  <circle cx="256" cy="256" r="8" fill="#0a5226"/>
</svg>

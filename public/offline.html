<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f7a4a" />
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <title>Sin conexión — TuTurno</title>
  <style>
    :root {
      color-scheme: light dark;
    }

    * {
      margin: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: Inter, system-ui, -apple-system, sans-serif;
      background: #f7faf8;
      color: #0b1f17;
    }

    body.dark {
      background: #071510;
      color: #f2f8f5;
    }

    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      text-align: center;
      max-width: 340px;
    }

    .mark {
      width: 88px;
      height: 88px;
      border-radius: 22px;
      box-shadow: 0 12px 32px rgba(15, 122, 74, 0.25);
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    p {
      font-size: 0.9375rem;
      line-height: 1.55;
      color: #5f7168;
    }

    body.dark p {
      color: #9bafa5;
    }

    button {
      margin-top: 4px;
      min-height: 44px;
      padding: 0 28px;
      border: 0;
      border-radius: 12px;
      background: #0f7a4a;
      color: #fff;
      font: inherit;
      font-weight: 600;
      font-size: 0.9375rem;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    body.dark button {
      background: #34d399;
      color: #071510;
    }

    button:active {
      transform: scale(0.97);
    }

    .hint {
      font-size: 0.8125rem;
      color: #82968c;
    }
  </style>
</head>

<body>
  <script>
    // Respeta el tema elegido en la app; si no hay preferencia, sigue al SO.
    (function () {
      var t = localStorage.getItem('tuturno:theme');
      var dark = t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
      if (dark) document.body.classList.add('dark');
    })();
  </script>
  <main>
    <img class="mark" src="/logo-mark.svg" alt="TuTurno" />
    <h1>Sin conexión</h1>
    <p>TuTurno necesita internet para mostrar tu agenda y tus reservas. Revisa tu conexión e intenta de nuevo.</p>
    <button type="button" onclick="location.reload()">Reintentar</button>
    <p class="hint">La página se recargará sola cuando vuelva la conexión.</p>
  </main>
  <script>
    addEventListener('online', function () { location.reload() });
  </script>
</body>

</html>
